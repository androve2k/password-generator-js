<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>password-generator-js — Live Demo</title>
<meta name="description" content="Cryptographically secure password generator. Zero dependencies, MIT licensed.">
<style>
  :root {
    --bg: #0b1220; --card: #131c2e; --border: #263349;
    --text: #e2e8f0; --dim: #94a3b8; --accent: #3b82f6; --accent2: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 1.5rem;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 2rem; max-width: 480px; width: 100%;
  }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .sub { color: var(--dim); font-size: .9rem; margin-bottom: 1.5rem; }
  .sub a { color: var(--accent2); }
  .output {
    font-family: "SF Mono", Consolas, monospace; font-size: 1.1rem;
    background: #0a0f1a; border: 1px solid var(--border); border-radius: 8px;
    padding: .85rem 1rem; word-break: break-all; margin-bottom: 1rem;
    min-height: 1.5em;
  }
  .row { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  label { display: flex; align-items: center; gap: .35rem; font-size: .85rem; color: var(--dim); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .len-row { display: flex; justify-content: space-between; font-size: .85rem; color: var(--dim); margin-bottom: .3rem; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: .65rem 1.25rem; font-size: .9rem; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2563eb; }
  button.copy { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .strength-track { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: .5rem; }
  .strength-fill { height: 100%; transition: width .2s, background .2s; }
  .strength-label { font-size: .8rem; color: var(--dim); margin-top: .3rem; }
  footer { margin-top: 1.5rem; font-size: .75rem; color: var(--dim); text-align: center; }
  footer a { color: var(--accent2); }
</style>
</head>
<body>

<div class="card">
  <h1>🔒 password-generator-js</h1>
  <p class="sub">Zero-dependency, cryptographically secure. <a href="https://github.com/androve2k/password-generator-js">View source →</a></p>

  <div class="len-row"><span>Length</span><span id="len-val">16</span></div>
  <input type="range" id="len" min="4" max="64" value="16">

  <div class="row" style="margin-top:1rem">
    <label><input type="checkbox" id="upper" checked> Uppercase</label>
    <label><input type="checkbox" id="lower" checked> Lowercase</label>
    <label><input type="checkbox" id="numbers" checked> Numbers</label>
    <label><input type="checkbox" id="symbols" checked> Symbols</label>
  </div>

  <div class="output" id="output"></div>
  <div class="strength-track"><div class="strength-fill" id="strength-fill"></div></div>
  <div class="strength-label" id="strength-label"></div>

  <div class="row" style="margin-top:1.25rem">
    <button id="generate">🔄 Generate</button>
    <button class="copy" id="copy">📋 Copy</button>
  </div>

  <footer>
    MIT licensed · <a href="https://roversia.it/utility/password-sicura-en">Full-featured version on roversia.it</a>
  </footer>
</div>

<script type="module">
  import { generatePassword, estimateStrength } from '../src/password-generator.js';

  const $ = (id) => document.getElementById(id);
  const lenEl = $('len'), lenVal = $('len-val'), output = $('output');
  const fill = $('strength-fill'), label = $('strength-label');
  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];

  function options() {
    return {
      length: parseInt(lenEl.value, 10),
      upper: $('upper').checked,
      lower: $('lower').checked,
      numbers: $('numbers').checked,
      symbols: $('symbols').checked,
    };
  }

  function refresh() {
    lenVal.textContent = lenEl.value;
    try {
      const pwd = generatePassword(options());
      output.textContent = pwd;
      const { score, label: strengthLabel } = estimateStrength(pwd);
      fill.style.width = ((score + 1) / 5 * 100) + '%';
      fill.style.background = colors[score];
      label.textContent = strengthLabel;
    } catch (e) {
      output.textContent = e.message;
      fill.style.width = '0%';
      label.textContent = '';
    }
  }

  document.querySelectorAll('input').forEach(el => el.addEventListener('input', refresh));
  $('generate').addEventListener('click', refresh);
  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText(output.textContent);
    const btn = $('copy');
    const original = btn.textContent;
    btn.textContent = '✅ Copied';
    setTimeout(() => btn.textContent = original, 1200);
  });

  refresh();
</script>

</body>
